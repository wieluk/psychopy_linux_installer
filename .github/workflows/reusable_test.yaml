name: reusable test workflow

on:
  workflow_call:
    inputs:
      test-mode:
        required: false
        type: string
        default: "normal"
        description: "The test mode to run (normal, build, quick)"
  workflow_dispatch:
    inputs:
      test-mode:
        required: false
        type: string
        default: "normal"
        description: "The test mode to run (normal, build, quick)"

jobs:
  # ubuntu-22/24 get real hosted VMs; $SUDO/su prefixing below makes steps work root or not.
  run-installer-ubuntu:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        os:
          - ubuntu-24
          - ubuntu-22
        python_version: ${{ (inputs.test-mode == 'quick' || inputs.test-mode == 'build') && fromJson('["3.10"]') || fromJson('["3.8", "3.9", "3.10"]') }}
        psychopy_version: ${{ (inputs.test-mode == 'quick' || inputs.test-mode == 'build') && fromJson('["latest"]') || fromJson('["latest", "2024.1.4", "2023.2.3"]') }}
        include:
          - os: ubuntu-24
            runs_on: ubuntu-24.04
          - os: ubuntu-22
            runs_on: ubuntu-22.04
        exclude:
          # "latest" (2026.2.x) requires Python >=3.10; installing it on older Python is an
          # error by design (see check_psychopy_python_compatibility in the installer).
          - python_version: "3.8"
            psychopy_version: "latest"
          - python_version: "3.9"
            psychopy_version: "latest"
      fail-fast: false
    env:
      # -y alone doesn't guarantee non-interactive apt-get; some packages still prompt via debconf.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5

      - name: Create non-root sudo user
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get update -qq && $SUDO apt-get install -y sudo passwd
          $SUDO useradd -m -s /bin/bash testpsychopyuser
          # !requiretty: some distros default to requiring a tty for sudo even with NOPASSWD.
          printf '%s\n' "testpsychopyuser ALL=(ALL) NOPASSWD:ALL" "Defaults:testpsychopyuser !requiretty" | $SUDO tee /etc/sudoers.d/testpsychopyuser > /dev/null
          $SUDO chmod 0440 /etc/sudoers.d/testpsychopyuser
          $SUDO mkdir -p /home/testpsychopyuser/work
          $SUDO cp -r "$GITHUB_WORKSPACE"/. /home/testpsychopyuser/work/
          $SUDO chown -R testpsychopyuser:testpsychopyuser /home/testpsychopyuser
          $SUDO chmod +x /home/testpsychopyuser/work/psychopy_linux_installer

      - name: Install xvfb and audio stack
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get install -y xvfb alsa-utils
          # No /dev/snd in CI -- null-sink config lets PortAudio/ffpyplayer init without a real device.
          $SUDO tee /etc/asound.conf > /dev/null <<'EOF'
          pcm.!default { type plug; slave.pcm "null"; }
          ctl.!default { type hw; card 0; }
          pcm.surround21 { type plug; slave.pcm "null"; }
          pcm.surround40 { type plug; slave.pcm "null"; }
          pcm.surround41 { type plug; slave.pcm "null"; }
          pcm.surround50 { type plug; slave.pcm "null"; }
          pcm.surround51 { type plug; slave.pcm "null"; }
          pcm.surround71 { type plug; slave.pcm "null"; }
          EOF

      - name: Setup environment and install
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          PSYCHOPY_VERSION: ${{ matrix.psychopy_version }}
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO mkdir /tmp_dir
          $SUDO chmod -R a+rX /tmp_dir
          $SUDO chown -R testpsychopyuser:testpsychopyuser /tmp_dir

          # ubuntu-22 lacks an exact-match wheel for "latest"; skip in build mode, where --wxpython-wheel-index conflicts with --build-wxpython.
          EXTRA_ARGS=""
          if [ "${{ inputs.test-mode }}" != "build" ] && [ "${{ matrix.os }}" = "ubuntu-22" ]; then
            EXTRA_ARGS="--wxpython-wheel-index=https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/"
          fi

          BUILD_FLAG="${{ inputs.test-mode == 'build' && '--build-wxpython' || '' }}"
          ARGS="--python-version=$PYTHON_VERSION --psychopy-version=$PSYCHOPY_VERSION --install-dir=/tmp_dir --venv-name=psychopy -f --non-interactive --additional-packages=pytest $BUILD_FLAG $EXTRA_ARGS"
          $SUDO su - testpsychopyuser -c "cd ~/work && ./psychopy_linux_installer $ARGS"

      - name: Show installation logs
        if: always()
        run: |
          LOG_FILE=$(find /tmp /tmp_dir -name 'psychopy_linux_installer_*.log' -type f -print0 2>/dev/null | xargs -r -0 ls -t 2>/dev/null | head -n1)
          if [ -n "$LOG_FILE" ]; then
            echo "=== Found installation log: $LOG_FILE ==="
            cat "$LOG_FILE"
            echo "==== End of log ===="
          else
            echo "No installation logs found in either /tmp or /tmp_dir"
          fi

      - name: Verify PsychoPy installation, PATH, and version
        env:
          PSYCHOPY_VERSION: ${{ matrix.psychopy_version }}
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          if [ "$PSYCHOPY_VERSION" = "latest" ]; then
            PSYCHOPY_VERSION=$(curl -s "https://pypi.org/pypi/psychopy/json" | jq -r .info.version)
          fi
          if ! $SUDO su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy -v" | grep -qE "PsychoPy3, version $PSYCHOPY_VERSION"; then
            echo "PsychoPy version check failed in venv. Expected version: $PSYCHOPY_VERSION"
            exit 1
          fi

          if ! $SUDO su - testpsychopyuser -c "psychopy -v" | grep -qE "PsychoPy3, version $PSYCHOPY_VERSION"; then
            echo "psychopy not found in PATH or wrong version. Expected version: $PSYCHOPY_VERSION"
            exit 1
          fi

      - name: Run PsychoPy pytest
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          echo "Starting PsychoPy pytest..."
          # xvfb-run is a Debian-only wrapper script, not packaged everywhere -- start/stop Xvfb manually instead.
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          $SUDO su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python -m pytest .github/psychopy_tests/pytest_installation.py -v --disable-warnings"
          echo "PsychoPy pytest completed"

      - name: Run PsychoPy program
        id: run_psychopy_program
        # Runs once per mode, for the newest version tested, since "latest" now installs classic by default.
        if: ${{ matrix.psychopy_version == 'latest' }}
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          echo "Starting PsychoPy program..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          $SUDO su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python .github/psychopy_tests/test_program/test_program_lastrun.py"
          echo "PsychoPy program completed"

      - name: Uninstall PsychoPy and verify cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy --uninstall --non-interactive=y"
          sleep 5

          fail=0
          for path in "/usr/local/bin/psychopy" "/home/testpsychopyuser/.local/bin/psychopy" \
                      "/usr/share/applications/psychopy.desktop" "/home/testpsychopyuser/.local/share/applications/psychopy.desktop" \
                      "/home/testpsychopyuser/Desktop/psychopy.desktop"; do
            if [ -e "$path" ]; then
              echo "FAIL: expected '$path' to be removed by --uninstall, but it still exists"
              fail=1
            fi
          done
          if [ -d "/tmp_dir/psychopy" ]; then
            echo "FAIL: expected /tmp_dir/psychopy to be removed by --uninstall, but it still exists"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Uninstall cleanup verified: venv, PATH symlink, and desktop shortcuts were all removed."

      - name: Cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO userdel -r testpsychopyuser 2>/dev/null || true

  # Distros without a native GitHub-hosted VM image build inside an official Docker base image instead.
  run-installer-container:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # Restores caps Docker drops by default, needed so PAM can apply the installer's nice/rtprio/memlock group limits without breaking later "su -" sessions (hit on opensuse-leap-15).
      options: --cap-add=SYS_NICE --cap-add=SYS_RESOURCE --cap-add=IPC_LOCK
    strategy:
      matrix:
        # "quick": breadth (many distros, shallow). "normal"/"build": full depth. Pop!_OS/Mint omitted -- same package base as ubuntu-22/24, no separate image.
        os: ${{ inputs.test-mode == 'quick' && fromJson('["debian-12", "fedora-41", "rocky-9", "manjarolinux-25", "opensuse-leap-15"]') || fromJson('["ubuntu-20", "debian-13", "debian-12", "debian-11", "fedora-39", "fedora-40", "fedora-41", "rocky-9", "centos-9", "manjarolinux-25", "opensuse-leap-15"]') }}
        python_version: ${{ (inputs.test-mode == 'quick' || inputs.test-mode == 'build') && fromJson('["3.10"]') || fromJson('["3.8", "3.9", "3.10"]') }}
        # "quick"/"build" pin to the last pre-Studio release; "latest" now resolves to Studio, which has no venv/pytest and no wxPython (--build-wxpython is a no-op). test-studio (runs whenever test-mode != 'build') covers the Studio leg instead.
        psychopy_version: ${{ (inputs.test-mode == 'quick' || inputs.test-mode == 'build') && fromJson('["latest"]') || fromJson('["latest", "2024.1.4", "2023.2.3"]') }}
        # "include" must mirror the active "os" list exactly, or unmatched entries become orphaned combos missing python_version/psychopy_version.
        include: ${{ inputs.test-mode == 'quick' && fromJson('[{"os":"debian-12","image":"debian:bookworm"},{"os":"fedora-41","image":"fedora:41"},{"os":"rocky-9","image":"rockylinux:9"},{"os":"manjarolinux-25","image":"archlinux:latest"},{"os":"opensuse-leap-15","image":"opensuse/leap:15"}]') || fromJson('[{"os":"ubuntu-20","image":"ubuntu:20.04"},{"os":"debian-13","image":"debian:trixie"},{"os":"debian-12","image":"debian:bookworm"},{"os":"debian-11","image":"debian:bullseye"},{"os":"fedora-39","image":"fedora:39"},{"os":"fedora-40","image":"fedora:40"},{"os":"fedora-41","image":"fedora:41"},{"os":"rocky-9","image":"rockylinux:9"},{"os":"centos-9","image":"quay.io/centos/centos:stream9"},{"os":"manjarolinux-25","image":"archlinux:latest"},{"os":"opensuse-leap-15","image":"opensuse/leap:15"}]') }}
        exclude:
          # "latest" (2026.2.x) requires Python >=3.10; installing it on older Python is an
          # error by design (see check_psychopy_python_compatibility in the installer).
          - python_version: "3.8"
            psychopy_version: "latest"
          - python_version: "3.9"
            psychopy_version: "latest"
      fail-fast: false
    env:
      # -y alone doesn't guarantee non-interactive apt-get; some packages still prompt via debconf.
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Some minimal images (e.g. opensuse/leap) lack git+tar, which actions/checkout needs internally.
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get > /dev/null; then
            echo "PKG_MANAGER=apt-get" >> $GITHUB_ENV
            apt-get update -qq
            apt-get install -y git tar ca-certificates
          elif command -v dnf > /dev/null; then
            echo "PKG_MANAGER=dnf" >> $GITHUB_ENV
            dnf install -y git tar ca-certificates
          elif command -v yum > /dev/null; then
            echo "PKG_MANAGER=yum" >> $GITHUB_ENV
            yum install -y git tar ca-certificates
          elif command -v pacman > /dev/null; then
            echo "PKG_MANAGER=pacman" >> $GITHUB_ENV
            pacman -Sy --noconfirm git tar ca-certificates
          elif command -v zypper > /dev/null; then
            echo "PKG_MANAGER=zypper" >> $GITHUB_ENV
            zypper --non-interactive install git tar ca-certificates
          else
            echo "Unsupported package manager"
            exit 1
          fi

      - uses: actions/checkout@v5

      # Containers run as root by default; use a real non-root sudo user to exercise sudo_wrapper/SUDO_MODE properly.
      - name: Create non-root sudo user
        run: |
          case "${PKG_MANAGER}" in
            apt-get) apt-get update -qq && apt-get install -y sudo passwd ;;
            dnf|yum) $PKG_MANAGER install -y sudo passwd shadow-utils ;;
            pacman)  pacman -Syu --noconfirm sudo shadow ;;
            zypper)  zypper --non-interactive install sudo shadow ;;
          esac
          useradd -m -s /bin/bash testpsychopyuser
          # !requiretty: some distros (e.g. opensuse) default to requiring a tty for sudo even with NOPASSWD.
          printf '%s\n' "testpsychopyuser ALL=(ALL) NOPASSWD:ALL" "Defaults:testpsychopyuser !requiretty" > /etc/sudoers.d/testpsychopyuser
          chmod 0440 /etc/sudoers.d/testpsychopyuser
          mkdir -p /home/testpsychopyuser/work
          cp -r "$GITHUB_WORKSPACE"/. /home/testpsychopyuser/work/
          chown -R testpsychopyuser:testpsychopyuser /home/testpsychopyuser
          chmod +x /home/testpsychopyuser/work/psychopy_linux_installer

      - name: Install xvfb and audio stack
        run: |
          case "${PKG_MANAGER}" in
            apt-get) apt-get install -y xvfb alsa-utils ;;
            dnf|yum) $PKG_MANAGER install -y xorg-x11-server-Xvfb alsa-utils ;;
            pacman)  pacman -Sy --noconfirm xorg-server-xvfb alsa-utils ;;
            zypper)  zypper --non-interactive install xorg-x11-server-Xvfb alsa-utils ;;
          esac
          # No /dev/snd in a container -- null-sink config lets PortAudio/ffpyplayer init without a real device.
          cat > /etc/asound.conf <<'EOF'
          pcm.!default { type plug; slave.pcm "null"; }
          ctl.!default { type hw; card 0; }
          pcm.surround21 { type plug; slave.pcm "null"; }
          pcm.surround40 { type plug; slave.pcm "null"; }
          pcm.surround41 { type plug; slave.pcm "null"; }
          pcm.surround50 { type plug; slave.pcm "null"; }
          pcm.surround51 { type plug; slave.pcm "null"; }
          pcm.surround71 { type plug; slave.pcm "null"; }
          EOF

      - name: Setup environment and install
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          PSYCHOPY_VERSION: ${{ matrix.psychopy_version }}
        run: |
          rm -rf /tmp_dir
          mkdir /tmp_dir
          chmod -R a+rX /tmp_dir
          chown -R testpsychopyuser:testpsychopyuser /tmp_dir

          # manjarolinux-25 lacks an exact-match wheel for "latest"; skip in build mode, where --wxpython-wheel-index conflicts with --build-wxpython.
          EXTRA_ARGS=""
          if [ "${{ inputs.test-mode }}" != "build" ] && [ "${{ matrix.os }}" = "manjarolinux-25" ]; then
            EXTRA_ARGS="--wxpython-wheel-index=https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/"
          fi

          BUILD_FLAG="${{ inputs.test-mode == 'build' && '--build-wxpython' || '' }}"
          ARGS="--python-version=$PYTHON_VERSION --psychopy-version=$PSYCHOPY_VERSION --install-dir=/tmp_dir --venv-name=psychopy -f --non-interactive --additional-packages=pytest $BUILD_FLAG $EXTRA_ARGS"
          su - testpsychopyuser -c "cd ~/work && ./psychopy_linux_installer $ARGS"

      - name: Show installation logs
        if: always()
        run: |
          LOG_FILE=$(find /tmp /tmp_dir -name 'psychopy_linux_installer_*.log' -type f -print0 2>/dev/null | xargs -r -0 ls -t 2>/dev/null | head -n1)
          if [ -n "$LOG_FILE" ]; then
            echo "=== Found installation log: $LOG_FILE ==="
            cat "$LOG_FILE"
            echo "==== End of log ===="
          else
            echo "No installation logs found in either /tmp or /tmp_dir"
          fi

      - name: Verify PsychoPy installation, PATH, and version
        env:
          PSYCHOPY_VERSION: ${{ matrix.psychopy_version }}
        run: |
          if [ "$PSYCHOPY_VERSION" = "latest" ]; then
            PSYCHOPY_VERSION=$(curl -s "https://pypi.org/pypi/psychopy/json" | jq -r .info.version)
          fi
          if ! su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy -v" | grep -qE "PsychoPy3, version $PSYCHOPY_VERSION"; then
            echo "PsychoPy version check failed in venv. Expected version: $PSYCHOPY_VERSION"
            exit 1
          fi

          if ! su - testpsychopyuser -c "psychopy -v" | grep -qE "PsychoPy3, version $PSYCHOPY_VERSION"; then
            echo "psychopy not found in PATH or wrong version. Expected version: $PSYCHOPY_VERSION"
            exit 1
          fi

      - name: Run PsychoPy pytest
        run: |
          echo "Starting PsychoPy pytest..."
          # xvfb-run is a Debian-only wrapper script, not packaged everywhere (e.g. opensuse) -- start/stop Xvfb manually instead.
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python -m pytest .github/psychopy_tests/pytest_installation.py -v --disable-warnings"
          echo "PsychoPy pytest completed"

      - name: Run PsychoPy program
        id: run_psychopy_program
        # Runs once per mode, for the newest version tested, since "latest" now installs classic by default.
        if: ${{ matrix.psychopy_version == 'latest' }}
        run: |
          echo "Starting PsychoPy program..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python .github/psychopy_tests/test_program/test_program_lastrun.py"
          echo "PsychoPy program completed"

      - name: Uninstall PsychoPy and verify cleanup
        if: always()
        run: |
          su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy --uninstall --non-interactive=y"
          sleep 5

          fail=0
          for path in "/usr/local/bin/psychopy" "/home/testpsychopyuser/.local/bin/psychopy" \
                      "/usr/share/applications/psychopy.desktop" "/home/testpsychopyuser/.local/share/applications/psychopy.desktop" \
                      "/home/testpsychopyuser/Desktop/psychopy.desktop"; do
            if [ -e "$path" ]; then
              echo "FAIL: expected '$path' to be removed by --uninstall, but it still exists"
              fail=1
            fi
          done
          if [ -d "/tmp_dir/psychopy" ]; then
            echo "FAIL: expected /tmp_dir/psychopy to be removed by --uninstall, but it still exists"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Uninstall cleanup verified: venv, PATH symlink, and desktop shortcuts were all removed."

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp_dir
          userdel -r testpsychopyuser 2>/dev/null || true

  # Explicit --studio coverage; always "latest" since Studio AppImages only exist for versions where Studio exists.
  # Always ubuntu:24.04 -- use the native hosted VM directly, no container needed at all.
  test-studio:
    name: Test explicit --studio install
    if: ${{ inputs.test-mode != 'build' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5

      - name: Create non-root sudo user
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get update -qq && $SUDO apt-get install -y sudo passwd
          $SUDO useradd -m -s /bin/bash testpsychopyuser
          printf '%s\n' "testpsychopyuser ALL=(ALL) NOPASSWD:ALL" "Defaults:testpsychopyuser !requiretty" | $SUDO tee /etc/sudoers.d/testpsychopyuser > /dev/null
          $SUDO chmod 0440 /etc/sudoers.d/testpsychopyuser
          $SUDO mkdir -p /home/testpsychopyuser/work
          $SUDO cp -r "$GITHUB_WORKSPACE"/. /home/testpsychopyuser/work/
          $SUDO chown -R testpsychopyuser:testpsychopyuser /home/testpsychopyuser
          $SUDO chmod +x /home/testpsychopyuser/work/psychopy_linux_installer

      - name: Install xvfb and audio stack
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get install -y xvfb alsa-utils
          $SUDO tee /etc/asound.conf > /dev/null <<'EOF'
          pcm.!default { type plug; slave.pcm "null"; }
          ctl.!default { type hw; card 0; }
          pcm.surround21 { type plug; slave.pcm "null"; }
          pcm.surround40 { type plug; slave.pcm "null"; }
          pcm.surround41 { type plug; slave.pcm "null"; }
          pcm.surround50 { type plug; slave.pcm "null"; }
          pcm.surround51 { type plug; slave.pcm "null"; }
          pcm.surround71 { type plug; slave.pcm "null"; }
          EOF

      - name: Setup environment and install
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO mkdir /tmp_dir
          $SUDO chmod -R a+rX /tmp_dir
          $SUDO chown -R testpsychopyuser:testpsychopyuser /tmp_dir
          ARGS="--studio --install-dir=/tmp_dir --venv-name=psychopy -f --non-interactive"
          $SUDO su - testpsychopyuser -c "cd ~/work && ./psychopy_linux_installer $ARGS"

      - name: Show installation logs
        if: always()
        run: |
          LOG_FILE=$(find /tmp /tmp_dir -name 'psychopy_linux_installer_*.log' -type f -print0 2>/dev/null | xargs -r -0 ls -t 2>/dev/null | head -n1)
          if [ -n "$LOG_FILE" ]; then
            echo "=== Found installation log: $LOG_FILE ==="
            cat "$LOG_FILE"
            echo "==== End of log ===="
          else
            echo "No installation logs found in either /tmp or /tmp_dir"
          fi

      - name: Verify PsychoPy Studio installation
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          # Studio is a GUI Electron app -- "-v" doesn't print a version and exit, it launches the
          # full app, so just check the wrapper and AppImage are in place and executable (same as
          # the installer's own final verification), rather than trying to run the GUI in CI.
          if ! $SUDO su - testpsychopyuser -c '[ -x /tmp_dir/psychopy/start_psychopy ] && find /tmp_dir/psychopy -maxdepth 1 -name "PsychoPy_Studio_*.AppImage" -executable | grep -q .'; then
            echo "PsychoPy Studio installation verification failed: wrapper or AppImage missing/not executable."
            exit 1
          fi

      - name: Uninstall PsychoPy and verify cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy --uninstall --non-interactive=y"
          sleep 5

          fail=0
          for path in "/usr/local/bin/psychopy" "/home/testpsychopyuser/.local/bin/psychopy" \
                      "/usr/share/applications/psychopy.desktop" "/home/testpsychopyuser/.local/share/applications/psychopy.desktop" \
                      "/home/testpsychopyuser/Desktop/psychopy.desktop"; do
            if [ -e "$path" ]; then
              echo "FAIL: expected '$path' to be removed by --uninstall, but it still exists"
              fail=1
            fi
          done
          if [ -d "/tmp_dir/psychopy" ]; then
            echo "FAIL: expected /tmp_dir/psychopy to be removed by --uninstall, but it still exists"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Uninstall cleanup verified: venv, PATH symlink, and desktop shortcuts were all removed."

      - name: Cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO userdel -r testpsychopyuser 2>/dev/null || true

  # Always ubuntu:24.04 -- use the native hosted VM directly, no container needed at all.
  run-installer-with-requirements-txt:
    name: Run installer with requirements file
    if: ${{ inputs.test-mode != 'build' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        req_file:
          - ".github/psychopy_tests/test_windows_requirements.txt"
          - ".github/psychopy_tests/test_linux_requirements.txt"
      fail-fast: false
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v5

      - name: Create non-root sudo user
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get update -qq && $SUDO apt-get install -y sudo passwd
          $SUDO useradd -m -s /bin/bash testpsychopyuser
          printf '%s\n' "testpsychopyuser ALL=(ALL) NOPASSWD:ALL" "Defaults:testpsychopyuser !requiretty" | $SUDO tee /etc/sudoers.d/testpsychopyuser > /dev/null
          $SUDO chmod 0440 /etc/sudoers.d/testpsychopyuser
          $SUDO mkdir -p /home/testpsychopyuser/work
          $SUDO cp -r "$GITHUB_WORKSPACE"/. /home/testpsychopyuser/work/
          $SUDO chown -R testpsychopyuser:testpsychopyuser /home/testpsychopyuser
          $SUDO chmod +x /home/testpsychopyuser/work/psychopy_linux_installer

      - name: Install xvfb and audio stack
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO apt-get install -y xvfb alsa-utils
          $SUDO tee /etc/asound.conf > /dev/null <<'EOF'
          pcm.!default { type plug; slave.pcm "null"; }
          ctl.!default { type hw; card 0; }
          pcm.surround21 { type plug; slave.pcm "null"; }
          pcm.surround40 { type plug; slave.pcm "null"; }
          pcm.surround41 { type plug; slave.pcm "null"; }
          pcm.surround50 { type plug; slave.pcm "null"; }
          pcm.surround51 { type plug; slave.pcm "null"; }
          pcm.surround71 { type plug; slave.pcm "null"; }
          EOF

      - name: Setup environment and install from requirements file
        env:
          REQ_FILE: ${{ matrix.req_file }}
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO mkdir /tmp_dir
          $SUDO chmod -R a+rX /tmp_dir
          $SUDO chown -R testpsychopyuser:testpsychopyuser /tmp_dir
          ARGS="--install-dir=/tmp_dir --venv-name=psychopy -f --non-interactive --requirements-file=$REQ_FILE --additional-packages=pytest"
          $SUDO su - testpsychopyuser -c "cd ~/work && ./psychopy_linux_installer $ARGS"

      - name: Show installation logs
        if: always()
        run: |
          LOG_FILE=$(find /tmp /tmp_dir -name 'psychopy_linux_installer_*.log' -type f -print0 2>/dev/null | xargs -r -0 ls -t 2>/dev/null | head -n1)
          if [ -n "$LOG_FILE" ]; then
            echo "=== Found installation log: $LOG_FILE ==="
            cat "$LOG_FILE"
            echo "==== End of log ===="
          else
            echo "No installation logs found in either /tmp or /tmp_dir"
          fi

      - name: Verify PsychoPy installation and version
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy -v"

      - name: Compare installed packages with requirements.txt
        env:
          REQ_FILE: ${{ matrix.req_file }}
        run: |
          differences_found=0

          # Read the requirements file line by line.
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="$(echo "$line" | xargs)"
            if [[ -z "$line" || "$line" =~ ^# ]]; then
              continue
            fi

            # Check if the line has a version specifier.
            if [[ "$line" == *"=="* ]]; then
              pkg="$(echo "$line" | cut -d'=' -f1 | xargs | tr '[:upper:]' '[:lower:]')"
              # Assuming the format "package==version", field 3 is the version.
              req_ver="$(echo "$line" | cut -d'=' -f3 | xargs)"
            elif [[ "$line" == *" @ "* ]]; then
              # Handle PEP 440 direct references: "package @ file:///..." or "package @ https://..."
              pkg="$(echo "$line" | cut -d'@' -f1 | xargs | tr '[:upper:]' '[:lower:]')"
              req_ver=""
            else
              pkg="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
              req_ver=""
            fi

            # Get the installed version using pip show.
            installed_version="$(/tmp_dir/psychopy/.venv/bin/pip show "$pkg" 2>/dev/null | grep -i '^Version:' | awk '{print $2}' || true)"
            if [[ -z "$installed_version" ]]; then
              echo "Missing: $pkg (required ${req_ver:-any version})"
              differences_found=1
            elif [[ -n "$req_ver" && "$installed_version" != "$req_ver" ]]; then
              echo "Version mismatch: $pkg (required $req_ver, installed $installed_version)"
              differences_found=1
            fi
          done < "$REQ_FILE"

          if [[ $differences_found -eq 0 ]]; then
            echo "All requirements match the installed environment."
          fi

      - name: Run PsychoPy pytest
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          echo "Starting PsychoPy pytest..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          $SUDO su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python -m pytest .github/psychopy_tests/pytest_installation.py -v --disable-warnings"
          echo "PsychoPy pytest completed"

      - name: Run PsychoPy program
        id: run_psychopy_program
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          echo "Starting PsychoPy program..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          i=0; while [ ! -e /tmp/.X11-unix/X99 ] && [ $i -lt 20 ]; do sleep 0.25; i=$((i + 1)); done
          $SUDO su - testpsychopyuser -c "export DISPLAY=:99; cd ~/work && /tmp_dir/psychopy/.venv/bin/python .github/psychopy_tests/test_program/test_program_lastrun.py"
          echo "PsychoPy program completed"

      - name: Uninstall PsychoPy
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO su - testpsychopyuser -c "/tmp_dir/psychopy/start_psychopy --uninstall --non-interactive=y"
          sleep 5

      - name: Cleanup
        if: always()
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO rm -rf /tmp_dir
          $SUDO userdel -r testpsychopyuser 2>/dev/null || true
